services:
  postgres:
    image: postgres:16
    container_name: event_registration_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_registration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: event_registration_mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: event_registration_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_registration
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@events.local
      OUTBOX_POLL_SECONDS: 2
      OUTBOX_BATCH_SIZE: 20
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: event_registration_worker
    restart: always
    command: python -m backend.app.workers.outbox
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_registration
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@events.local
      OUTBOX_POLL_SECONDS: 2
      OUTBOX_BATCH_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: event_registration_scheduler
    restart: always
    command: python -m backend.app.workers.scheduler
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/event_registration
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@events.local
      OUTBOX_POLL_SECONDS: 2
      OUTBOX_BATCH_SIZE: 20
      SCHEDULER_POLL_SECONDS: 30
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
